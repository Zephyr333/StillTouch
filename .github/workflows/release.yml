name: Build tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\StillTouch.slnx

      - name: Build with warnings as errors
        run: dotnet build .\StillTouch.slnx -c Release --no-restore -warnaserror

      - name: Run tests
        run: dotnet run --project .\StillTouch.Tests\StillTouch.Tests.csproj -c Release --no-build

      - name: Publish single-file executable
        run: dotnet publish .\StillTouch\StillTouch.csproj -c Release -r win-x64 --self-contained true --no-restore -warnaserror -o .\artifacts

      - name: Validate release artifact
        id: artifact
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath .\artifacts -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "StillTouch.exe") {
            throw "Expected exactly one release file named StillTouch.exe."
          }

          [xml] $project = Get-Content -LiteralPath .\StillTouch\StillTouch.csproj
          $version = [string] $project.Project.PropertyGroup.Version
          $expectedTag = "v$version"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Tag ${{ github.ref_name }} does not match project version $version."
          }

          $versionInfo = $files[0].VersionInfo
          if ($versionInfo.FileVersion -ne "$version.0") {
            throw "FileVersion $($versionInfo.FileVersion) does not match $version.0."
          }
          if ($versionInfo.ProductVersion -ne $version) {
            throw "ProductVersion $($versionInfo.ProductVersion) does not match $version."
          }

          $hash = (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Replace only an empty draft for this tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $releaseJson = gh release view $tag --repo "${{ github.repository }}" --json isDraft,assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            exit 0
          }

          $release = $releaseJson | ConvertFrom-Json
          if (-not $release.isDraft -or @($release.assets).Count -ne 0) {
            throw "Refusing to replace a published or non-empty release for $tag."
          }

          gh release delete $tag --repo "${{ github.repository }}" --yes

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $hash = "${{ steps.artifact.outputs.sha256 }}"
          $notes = @"
          StillTouch 单文件 Windows x64 版本。

          本版重点修复连续触控、输入配对、退出稳定性和诊断能力：
          - 修复部分触摸设备在零接触尾报告后只有第一次点击有效的问题。
          - 触摸派生鼠标消息按 Down/Up 成对抑制，不再吞掉已放行 Down 对应的 Up。
          - Raw Up 确认轻点后先立即注入左键，再取消长按计时器，减少抬起后的额外延迟。
          - 诊断追踪新增 Raw 设备、帧、接触代次、序列、消息排队和注入耗时关联。
          - Hook/SendInput 使用独立消息线程，并保留有界抬键与退出看门狗。

          验证：警告即错误构建通过，70/70 自动化测试通过；发布产物版本与标签一致。

          已知边界：当前便携版使用 Raw Input + 低级鼠标 Hook，无法阻止目标程序直接消费
          WM_POINTER/WM_TOUCH；此类程序仍可能同时响应原生触摸和注入鼠标。同位置触控双击
          仍需更多 MateBook 实机事件顺序数据确认。

          SHA-256：$hash

          此 EXE 尚未数字签名，UAC 显示“未知发布者”属于预期行为。
          "@

          $arguments = @(
            "release", "create", $tag, ".\artifacts\StillTouch.exe",
            "--repo", "${{ github.repository }}",
            "--verify-tag",
            "--title", "StillTouch $tag",
            "--notes", $notes
          )
          if ($tag.Contains("-")) {
            $arguments += "--prerelease"
          }

          gh @arguments
